name: Build musetalk Docker image

# musetalk wraps TMElyralab/MuseTalk (V1.5) com FastAPI + WebSocket pra
# streaming de áudio→frames lip-sync em tempo real. Image ~6-8GB (CUDA
# 11.8 runtime + torch + 4GB de pesos lazy-pulled no primeiro start).

on:
  push:
    branches: [main]
    paths:
      - "musetalk/**"
      - ".github/workflows/build-musetalk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
            /usr/local/graalvm /usr/local/share/chromium /usr/local/share/powershell \
            /usr/local/.ghcup /opt/az /usr/share/miniconda /usr/local/go \
            /usr/local/julia* /usr/local/sqlpackage /opt/microsoft /usr/local/aws-cli
          sudo apt-get purge -y -qq firefox google-chrome-stable \
            microsoft-edge-stable dotnet* aspnetcore* 2>/dev/null || true
          sudo apt-get autoremove -y -qq && sudo apt-get clean
          docker system prune -af
          echo "Free space:" && df -h /

      - name: Verify build context
        run: |
          ls -la musetalk/
          test -f musetalk/Dockerfile || { echo "ERROR: Dockerfile missing"; exit 1; }
          test -f musetalk/start.sh   || { echo "ERROR: start.sh missing"; exit 1; }
          test -f musetalk/server.py  || { echo "ERROR: server.py missing"; exit 1; }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push musetalk
        uses: docker/build-push-action@v6
        with:
          context: musetalk
          file: musetalk/Dockerfile
          push: true
          tags: |
            marcosremar/musetalk:latest
            marcosremar/musetalk:${{ github.sha }}
            ghcr.io/marcosremar/musetalk:latest
            ghcr.io/marcosremar/musetalk:${{ github.sha }}
          cache-from: type=gha,scope=musetalk
          cache-to: type=gha,mode=max,scope=musetalk
