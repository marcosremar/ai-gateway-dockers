name: Build fbx2glb Docker image

# fbx2glb wraps Blender 4.5 headless + the autoresearch POSITION-rebase
# post-process in a FastAPI service. CPU-only (no CUDA); final image ~500MB.

on:
  push:
    branches: [main]
    paths:
      - "fbx2glb/**"
      - ".github/workflows/build-fbx2glb.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify build context
        run: |
          ls -la fbx2glb/
          test -f fbx2glb/Dockerfile     || { echo "ERROR: Dockerfile missing";     exit 1; }
          test -f fbx2glb/start.sh       || { echo "ERROR: start.sh missing";       exit 1; }
          test -f fbx2glb/server.py      || { echo "ERROR: server.py missing";      exit 1; }
          test -f fbx2glb/convert.sh     || { echo "ERROR: convert.sh missing";     exit 1; }
          test -f fbx2glb/idle_watchdog.py || { echo "ERROR: idle_watchdog.py missing"; exit 1; }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push fbx2glb
        uses: docker/build-push-action@v6
        with:
          context: fbx2glb
          file: fbx2glb/Dockerfile
          push: true
          tags: |
            marcosremar/fbx2glb:latest
            marcosremar/fbx2glb:${{ github.sha }}
            ghcr.io/marcosremar/fbx2glb:latest
            ghcr.io/marcosremar/fbx2glb:${{ github.sha }}
          cache-from: type=gha,scope=fbx2glb
          cache-to: type=gha,mode=max,scope=fbx2glb

  deploy:
    # Deploy the freshly-built image to Fly.io. Requires FLY_API_TOKEN secret.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly
        run: flyctl deploy --remote-only --image marcosremar/fbx2glb:${{ github.sha }} -c fbx2glb/fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
