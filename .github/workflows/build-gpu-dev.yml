name: Build gpu-dev Docker image

# gpu-dev is the minimal CUDA + Python + SSH base image used by
# `ai-gateway gpu dev start` for interactive prototyping on GPU.
# Target size: ~2-3GB for fast pulls.

on:
  push:
    branches: [main]
    paths:
      - "gpu-dev/**"
      - ".github/workflows/build-gpu-dev.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
            /usr/local/graalvm /usr/local/share/chromium /usr/local/share/powershell \
            /usr/local/.ghcup /opt/az /usr/share/miniconda /usr/local/go \
            /usr/local/julia* /usr/local/sqlpackage /opt/microsoft /usr/local/aws-cli
          sudo apt-get purge -y -qq firefox google-chrome-stable \
            microsoft-edge-stable dotnet* aspnetcore* 2>/dev/null || true
          sudo apt-get autoremove -y -qq && sudo apt-get clean
          docker system prune -af
          echo "Free space:" && df -h /

      - name: Verify build context
        run: |
          ls -la gpu-dev/
          test -f gpu-dev/Dockerfile || { echo "ERROR: Dockerfile missing"; exit 1; }
          test -f gpu-dev/start.sh || { echo "ERROR: start.sh missing"; exit 1; }
          test -f gpu-dev/health_server.py || { echo "ERROR: health_server.py missing"; exit 1; }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push gpu-dev base
        uses: docker/build-push-action@v6
        with:
          context: gpu-dev
          file: gpu-dev/Dockerfile
          push: true
          tags: |
            marcosremar/gpu-dev:latest
            marcosremar/gpu-dev:${{ github.sha }}
            ghcr.io/marcosremar/gpu-dev:latest
            ghcr.io/marcosremar/gpu-dev:${{ github.sha }}
          cache-from: type=gha,scope=gpu-dev
          cache-to: type=gha,mode=max,scope=gpu-dev
