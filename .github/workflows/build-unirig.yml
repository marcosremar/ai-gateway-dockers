name: Build unirig Docker image

on:
  push:
    branches: [main]
    paths:
      - "unirig/**"
      - ".github/workflows/build-unirig.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
            /usr/local/graalvm /usr/local/share/chromium /usr/local/share/powershell \
            /usr/local/.ghcup /opt/az /usr/share/miniconda /usr/local/go \
            /usr/local/julia* /usr/local/sqlpackage /opt/microsoft /usr/local/aws-cli
          sudo apt-get purge -y -qq firefox google-chrome-stable \
            microsoft-edge-stable dotnet* aspnetcore* 2>/dev/null || true
          sudo apt-get autoremove -y -qq && sudo apt-get clean
          docker system prune -af
          echo "Free space:" && df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: unirig
          file: unirig/Dockerfile
          push: true
          tags: |
            marcosremar/unirig:latest
            marcosremar/unirig:${{ github.sha }}
            ghcr.io/marcosremar/unirig:latest
            ghcr.io/marcosremar/unirig:${{ github.sha }}
          cache-from: type=gha,scope=unirig
          cache-to: type=gha,mode=max,scope=unirig

      - name: Smoke test (CPU mode)
        run: |
          set -e
          docker run -d --rm --name smoke \
            marcosremar/unirig:latest \
            bash -c "tail -f /dev/null"
          sleep 5

          echo "=== Verify files ==="
          docker exec smoke ls -la /app/server.py /app/start.sh /app/unirig/README.md

          echo "=== Verify Python imports ==="
          docker exec smoke python -c "
          import torch, trimesh, open3d, fastapi, uvicorn
          print(f'torch {torch.__version__}')
          from huggingface_hub import snapshot_download
          print('imports OK')
          "

          echo "=== Verify Blender ==="
          docker exec smoke /opt/blender/blender --version || echo "Blender check skipped"

          echo "=== Verify checkpoints ==="
          docker exec smoke ls /app/unirig/checkpoints/ || echo "No checkpoints (will download on first run)"

          echo "=== Cleanup ==="
          docker stop smoke
