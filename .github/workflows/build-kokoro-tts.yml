name: Build kokoro-tts Docker image

# Kokoro 82M TTS, 9 languages (incl. PT-BR), 24kHz native PyTorch.
# Runs on CUDA 12.4 runtime; 82M params — also works on CPU at 1-2x realtime.

on:
  push:
    branches: [main]
    paths:
      - "kokoro-tts/**"
      - ".github/workflows/build-kokoro-tts.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
            /usr/local/graalvm /usr/local/share/chromium /usr/local/share/powershell \
            /usr/local/.ghcup /opt/az /usr/share/miniconda /usr/local/go \
            /usr/local/julia* /usr/local/sqlpackage /opt/microsoft /usr/local/aws-cli
          sudo apt-get purge -y -qq firefox google-chrome-stable \
            microsoft-edge-stable dotnet* aspnetcore* 2>/dev/null || true
          sudo apt-get autoremove -y -qq && sudo apt-get clean
          docker system prune -af
          echo "Free space:" && df -h /

      - name: Verify build context
        run: |
          ls -la kokoro-tts/
          test -f kokoro-tts/Dockerfile || { echo "ERROR: Dockerfile missing"; exit 1; }
          test -f kokoro-tts/server.py  || { echo "ERROR: server.py missing"; exit 1; }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push kokoro-tts
        uses: docker/build-push-action@v6
        with:
          context: kokoro-tts
          file: kokoro-tts/Dockerfile
          push: true
          tags: |
            marcosremar/kokoro-tts:latest
            marcosremar/kokoro-tts:${{ github.sha }}
            ghcr.io/marcosremar/kokoro-tts:latest
            ghcr.io/marcosremar/kokoro-tts:${{ github.sha }}
          cache-from: type=gha,scope=kokoro-tts
          cache-to: type=gha,mode=max,scope=kokoro-tts
