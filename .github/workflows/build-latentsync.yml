name: Build latentsync Docker image

# latentsync wraps bytedance/LatentSync (audio-conditioned latent diffusion
# lip-sync) with the same FastAPI shape as musetalk, so the gateway pipeline
# can swap engines via the LIPSYNC_URL env. Image ~5-7GB (CUDA 12.4 runtime
# + torch + LatentSync upstream + lazy-pulled HF checkpoints on first run).

on:
  push:
    branches: [main]
    paths:
      - "latentsync/**"
      - ".github/workflows/build-latentsync.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
            /usr/local/graalvm /usr/local/share/chromium /usr/local/share/powershell \
            /usr/local/.ghcup /opt/az /usr/share/miniconda /usr/local/go \
            /usr/local/julia* /usr/local/sqlpackage /opt/microsoft /usr/local/aws-cli
          sudo apt-get purge -y -qq firefox google-chrome-stable \
            microsoft-edge-stable dotnet* aspnetcore* 2>/dev/null || true
          sudo apt-get autoremove -y -qq && sudo apt-get clean
          docker system prune -af
          echo "Free space:" && df -h /

      - name: Verify build context
        run: |
          ls -la latentsync/
          test -f latentsync/Dockerfile || { echo "ERROR: Dockerfile missing"; exit 1; }
          test -f latentsync/start.sh   || { echo "ERROR: start.sh missing"; exit 1; }
          test -f latentsync/server.py  || { echo "ERROR: server.py missing"; exit 1; }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push latentsync
        uses: docker/build-push-action@v6
        with:
          context: latentsync
          file: latentsync/Dockerfile
          push: true
          tags: |
            marcosremar/latentsync:latest
            marcosremar/latentsync:${{ github.sha }}
            ghcr.io/marcosremar/latentsync:latest
            ghcr.io/marcosremar/latentsync:${{ github.sha }}
          cache-from: type=gha,scope=latentsync
          cache-to: type=gha,mode=max,scope=latentsync
