name: Build unreal-desktop Docker image

# unreal-desktop: Ubuntu 22.04 + CUDA 12.2 + XFCE + NoMachine + Unreal Engine
# build/runtime deps. Used for remote Unreal dev/render on Vast.ai GPU pods.

on:
  push:
    branches: [main]
    paths:
      - "unreal-desktop/**"
      - ".github/workflows/build-unreal-desktop.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
            /usr/local/graalvm /usr/local/share/chromium /usr/local/share/powershell \
            /usr/local/.ghcup /opt/az /usr/share/miniconda /usr/local/go \
            /usr/local/julia* /usr/local/sqlpackage /opt/microsoft /usr/local/aws-cli
          sudo apt-get purge -y -qq firefox google-chrome-stable \
            microsoft-edge-stable dotnet* aspnetcore* 2>/dev/null || true
          sudo apt-get autoremove -y -qq && sudo apt-get clean
          docker system prune -af
          echo "Free space:" && df -h /

      - name: Verify build context
        run: |
          ls -la unreal-desktop/
          test -f unreal-desktop/Dockerfile || { echo "ERROR: Dockerfile missing"; exit 1; }
          test -f unreal-desktop/start.sh || { echo "ERROR: start.sh missing"; exit 1; }
          test -f unreal-desktop/health_server.py || { echo "ERROR: health_server.py missing"; exit 1; }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push unreal-desktop
        uses: docker/build-push-action@v6
        with:
          context: unreal-desktop
          file: unreal-desktop/Dockerfile
          push: true
          tags: |
            marcosremar/unreal-desktop:latest
            marcosremar/unreal-desktop:${{ github.sha }}
            ghcr.io/marcosremar/unreal-desktop:latest
            ghcr.io/marcosremar/unreal-desktop:${{ github.sha }}
          cache-from: type=gha,scope=unreal-desktop
          cache-to: type=gha,mode=max,scope=unreal-desktop
