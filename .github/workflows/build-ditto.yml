name: Build ditto Docker image

# ditto wraps antgroup/ditto-talkinghead (Diffusion-Free Audio-Driven Talking
# Head) with FastAPI chat server (Groq STT/LLM/TTS → Ditto inference →
# face-composite onto body background). Image ~10-12GB (CUDA 12.1 runtime +
# torch + TRT 8.6.1 + ~6GB checkpoints baked in for ~5s cold-start).

on:
  push:
    branches: [main]
    paths:
      - "ditto/**"
      - ".github/workflows/build-ditto.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
            /usr/local/graalvm /usr/local/share/chromium /usr/local/share/powershell \
            /usr/local/.ghcup /opt/az /usr/share/miniconda /usr/local/go \
            /usr/local/julia* /usr/local/sqlpackage /opt/microsoft /usr/local/aws-cli
          sudo apt-get purge -y -qq firefox google-chrome-stable \
            microsoft-edge-stable dotnet* aspnetcore* 2>/dev/null || true
          sudo apt-get autoremove -y -qq && sudo apt-get clean
          docker system prune -af
          echo "Free space:" && df -h /

      - name: Verify build context
        run: |
          ls -la ditto/
          test -f ditto/Dockerfile          || { echo "ERROR: Dockerfile missing"; exit 1; }
          test -f ditto/start.sh            || { echo "ERROR: start.sh missing"; exit 1; }
          test -f ditto/chat_server.py      || { echo "ERROR: chat_server.py missing"; exit 1; }
          test -f ditto/hf-download         || { echo "ERROR: hf-download missing"; exit 1; }
          test -f ditto/charlie_ref.mp4     || { echo "ERROR: charlie_ref.mp4 missing"; exit 1; }
          test -f ditto/charlie_body_bg.mp4 || { echo "ERROR: charlie_body_bg.mp4 missing"; exit 1; }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ditto
        uses: docker/build-push-action@v6
        with:
          context: ditto
          file: ditto/Dockerfile
          push: true
          tags: |
            marcosremar/ditto:latest
            marcosremar/ditto:${{ github.sha }}
            ghcr.io/marcosremar/ditto:latest
            ghcr.io/marcosremar/ditto:${{ github.sha }}
          cache-from: type=gha,scope=ditto
          cache-to: type=gha,mode=max,scope=ditto
