name: Build qwen3-tts Docker image

# qwen3-tts wraps Alibaba Qwen3-TTS with FastAPI exposing OpenAI-compatible
# /v1/audio/speech and a /v1/audio/speech/clone voice-cloning endpoint, so
# the canal-dark / babelcast pipelines can route to it identically to
# kokoro-tts or Modal qwen3-tts. Image ~6-8GB (CUDA 12.4 runtime + torch +
# qwen-tts; ~14GB pesos lazy-pulled no primeiro start).

on:
  push:
    branches: [main]
    paths:
      - "qwen3-tts/**"
      - ".github/workflows/build-qwen3-tts.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
            /usr/local/graalvm /usr/local/share/chromium /usr/local/share/powershell \
            /usr/local/.ghcup /opt/az /usr/share/miniconda /usr/local/go \
            /usr/local/julia* /usr/local/sqlpackage /opt/microsoft /usr/local/aws-cli
          sudo apt-get purge -y -qq firefox google-chrome-stable \
            microsoft-edge-stable dotnet* aspnetcore* 2>/dev/null || true
          sudo apt-get autoremove -y -qq && sudo apt-get clean
          docker system prune -af
          echo "Free space:" && df -h /

      - name: Verify build context
        run: |
          ls -la qwen3-tts/
          test -f qwen3-tts/Dockerfile || { echo "ERROR: Dockerfile missing"; exit 1; }
          test -f qwen3-tts/start.sh   || { echo "ERROR: start.sh missing"; exit 1; }
          test -f qwen3-tts/server.py  || { echo "ERROR: server.py missing"; exit 1; }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push qwen3-tts
        uses: docker/build-push-action@v6
        with:
          context: qwen3-tts
          file: qwen3-tts/Dockerfile
          push: true
          tags: |
            marcosremar/qwen3-tts:latest
            marcosremar/qwen3-tts:${{ github.sha }}
            ghcr.io/marcosremar/qwen3-tts:latest
            ghcr.io/marcosremar/qwen3-tts:${{ github.sha }}
          cache-from: type=gha,scope=qwen3-tts
          cache-to: type=gha,mode=max,scope=qwen3-tts
